<style>
    .toast-message {
        position: fixed;
        top: 25px;
        right: 25px;

        min-width: 280px;
        max-width: 380px;

        padding: 14px 18px;

        background: #ffffff;
        color: #212529;

        border-left: 5px solid #0d6efd;
        border-radius: 10px;

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

        font-size: 15px;
        font-weight: 500;

        opacity: 0;
        visibility: hidden;

        transform: translateX(120%);

        transition:
            opacity 0.3s ease,
            transform 0.3s ease,
            visibility 0.3s ease;

        z-index: 9999;
    }


    /* Toast Show */

    .toast-message.show {
        opacity: 1;
        visibility: visible;

        transform: translateX(0);
    }
</style>

<div id="toastMessage" class="toast-message"></div>

<script>
    function showtoastMessage(msg) {

        const toast = document.getElementById("toastMessage");

        toast.textContent = msg;

        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 1000);
    }
</script>
