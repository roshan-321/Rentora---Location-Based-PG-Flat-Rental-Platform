
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Rentora{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Chatbot CSS -->
    <link rel="stylesheet" href="{% static 'css/chatbot.css' %}">

    <!-- Page Specific CSS -->
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navbar -->
    {% include "navbar.html" %}

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include "footer.html" %}

    <!-- Chatbot HTML: Available on Every Page -->
    {% include "chatbot.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toast Messages -->
    {% include "toast_msg.html" %}

    <!-- Auth Guard -->
    <script src="{% static 'js/auth_guard.js' %}"></script>

    <!-- Chatbot JS -->
    <script src="{% static 'js/chatbot.js' %}" defer></script>

    <!-- Page Specific JS -->
    {% block script %}
    {% endblock %}

</body>
</html>
