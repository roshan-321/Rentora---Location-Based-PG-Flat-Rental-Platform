
{% extends "base.html" %}
{% load static %}

{% block title %}User Details | Rentora{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/user_view.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>User Details</h2>
        <a href="/accounts/user/list" class="btn btn-outline-secondary">
            Back to Users
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">User Information</h5>
        </div>

        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">User ID</label>
                    <input type="text" id="id" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" id="first_name" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" id="last_name" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="text" id="email" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="phone_number" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <input type="text" id="gender" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <input type="text" id="role" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Is Active</label>
                    <input type="text" id="is_active" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Is Staff</label>
                    <input type="text" id="is_staff" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Is Superuser</label>
                    <input type="text" id="is_superuser" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Date Joined</label>
                    <input type="text" id="date_joined" class="form-control" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Login</label>
                    <input type="text" id="last_login" class="form-control" readonly>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'js/user_view.js' %}"></script>
{% endblock %}
