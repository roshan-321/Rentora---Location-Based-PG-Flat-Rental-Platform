
{% extends "base.html" %}
{% load static %}

{% block title %}Edit User | Rentora{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/user_edit.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Edit User</h2>
        <a href="/accounts/user/list" class="btn btn-outline-secondary">
            Back to Users
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">User Information</h5>
        </div>

        <div class="card-body">
            <form id="editUserForm">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">User ID</label>
                        <input type="text" id="id" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" id="first_name" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="last_name" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" id="phone_number" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select id="gender" class="form-select">
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <select id="role" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="owner">Owner</option>
                            <option value="tenant">Tenant</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Is Active</label>
                        <select id="is_active" class="form-select">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Is Staff</label>
                        <select id="is_staff" class="form-select">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Is Superuser</label>
                        <select id="is_superuser" class="form-select">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date Joined</label>
                        <input type="text" id="date_joined"
                               class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Last Login</label>
                        <input type="text" id="last_login"
                               class="form-control" readonly>
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        Update User
                    </button>

                    <a href="/accounts/users/list"
                       class="btn btn-secondary px-4">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'js/user_edit.js' %}"></script>
{% endblock %}
