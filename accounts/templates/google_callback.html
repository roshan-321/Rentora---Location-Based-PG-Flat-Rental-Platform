{% extends "base.html" %}
{% load static %}

{% block title %}
Google Authentication | Rentora
{% endblock %}

{% block extra_css %}
<style>
    .google-callback-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .google-loading {
        text-align: center;
    }

    .google-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #e9ecef;
        border-top: 5px solid #0d6efd;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
    }

    .google-loading h4 {
        margin-bottom: 8px;
        font-weight: 600;
    }

    .google-loading p {
        color: #6c757d;
        margin: 0;
    }

    @keyframes spin {
        100% {
            transform: rotate(360deg);
        }
    }
</style>
{% endblock %}

{% block content %}

<div class="container google-callback-container">

    <div class="google-loading">

        <div class="google-spinner"></div>

        <h4>Signing you in...</h4>

        <p>Please wait while we complete Google authentication.</p>

    </div>

</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/google_callback.js' %}"></script>
{% endblock %}
